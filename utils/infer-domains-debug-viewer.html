<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InferDomains Debug Viewer</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --line: #d8dee6;
  --text: #17202a;
  --muted: #5f6b7a;
  --accent: #165d9c;
  --bad: #b42318;
  --good: #087443;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: #202a37;
  color: #fff;
}
h1 { margin: 0; font-size: 16px; font-weight: 650; }
h2 { margin: 0 0 8px; font-size: 15px; }
h3 { margin: 12px 0 6px; font-size: 13px; }
h4 { margin: 10px 0 4px; font-size: 12px; color: #3d4652; text-transform: uppercase; }
button, .fileButton {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #9fb2c6;
  border-radius: 5px;
  padding: 6px 10px;
  color: #102033;
  background: #fff;
  cursor: pointer;
  font: inherit;
}
button:hover, .fileButton:hover { background: #eef3f8; }
input[type=file] { display: none; }
main {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  min-height: calc(100vh - 54px);
}
aside {
  border-right: 1px solid var(--line);
  background: var(--panel);
  padding: 12px;
  overflow: auto;
}
#content {
  padding: 16px 20px;
  overflow: auto;
}
.empty {
  max-width: 760px;
  padding: 22px;
  border: 1px dashed var(--line);
  background: var(--panel);
  border-radius: 6px;
  color: var(--muted);
}
.block {
  margin-bottom: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 10px;
}
.metricGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}
.metric {
  border: 1px solid #e1e6ed;
  border-radius: 6px;
  padding: 10px;
  background: #fbfcfd;
}
.metric strong {
  display: block;
  font-size: 20px;
  line-height: 1.1;
}
.tabBar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.tabButton {
  border-color: var(--line);
  color: #1e2938;
}
.tabButton.active {
  border-color: var(--accent);
  color: #fff;
  background: var(--accent);
}
.viewBar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 8px 0 12px;
}
.viewButton.active {
  border-color: var(--accent);
  color: #fff;
  background: var(--accent);
}
.searchRow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
input[type=search] {
  width: min(520px, 100%);
  border: 1px solid #b8c4d1;
  border-radius: 5px;
  padding: 7px 9px;
  font: inherit;
}
.pill {
  display: inline-block;
  margin: 0 4px 4px 0;
  padding: 2px 7px;
  border-radius: 999px;
  background: #e7ebf0;
  color: #1e2938;
}
.pill.bad { color: var(--bad); background: #fde9e7; }
.pill.good { color: var(--good); background: #e6f4ee; }
.domainGroup {
  border-top: 1px solid #eef1f4;
  margin-top: 10px;
  padding-top: 10px;
}
.domainValue {
  border: 1px solid #e1e6ed;
  border-radius: 6px;
  margin-top: 8px;
  padding: 10px;
  background: #fbfcfd;
}
.valueHeader {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 10px;
}
.splitList {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}
.hierarchyTree {
  border-top: 1px solid #eef1f4;
  padding-top: 8px;
}
.instanceNode {
  margin: 8px 0 0;
  padding-left: 14px;
  border-left: 2px solid #dbe3ec;
}
.instanceNode > summary {
  cursor: pointer;
  list-style-position: outside;
}
.instanceHeader {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
}
.instanceTitle {
  font-weight: 650;
}
.clusterSet {
  margin: 8px 0 0 8px;
}
.domainCluster {
  margin: 8px 0;
  padding: 8px;
  border: 1px solid #e1e6ed;
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  background: #fbfcfd;
}
.clusterHeader {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
}
.clusterItems {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 6px;
}
.objectList {
  margin: 4px 0 0;
  padding-left: 16px;
}
.domainPath {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 650;
  color: #102033;
  word-break: break-word;
}
.lifetimeModule {
  border-top: 1px solid #eef1f4;
  margin-top: 10px;
  padding-top: 10px;
}
.lifetimeRow {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 8px;
  padding: 3px 0;
  align-items: baseline;
}
.lifetimeAlias {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 650;
  color: #102033;
}
.lifetimeInferred { color: var(--good); }
ul { margin: 4px 0 0; padding-left: 18px; }
li { margin: 2px 0; }
pre {
  margin: 6px 0 0;
  padding: 8px;
  border-radius: 5px;
  background: #f0f2f5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: auto;
}
.rawJson {
  max-height: 70vh;
}
.sectionLead {
  margin-top: 0;
  color: var(--muted);
}
.muted { color: var(--muted); }
.error { color: var(--bad); font-weight: 650; }
.toolbar { display: flex; align-items: center; gap: 8px; }
.label { color: var(--muted); }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>InferDomains Debug Viewer</h1>
  <div class="toolbar">
    <label class="fileButton" for="jsonInput">Load JSON</label>
    <input id="jsonInput" type="file" accept="application/json,.json">
  </div>
</header>
<main>
  <aside id="summary">
    <h2>No Artifact Loaded</h2>
    <p class="muted">Load a <span class="domainPath">*.domain.json</span> artifact.</p>
  </aside>
  <section id="content">
    <div class="empty">Use <strong>Load JSON</strong> and select an InferDomains debug artifact.</div>
  </section>
</main>
<script>
const input = document.getElementById('jsonInput');
const summary = document.getElementById('summary');
const content = document.getElementById('content');
let currentData = null;
let currentGroups = [];
let activeTab = 'overview';
let domainFilter = '';
let domainMapMode = 'hierarchy';

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function uniqueBy(items, keyFn) {
  const seen = new Set();
  const result = [];
  for (const item of items) {
    const key = keyFn(item);
    if (seen.has(key)) continue;
    seen.add(key);
    result.push(item);
  }
  return result;
}

function annotationsForDisplay(data) {
  const latest = new Map();
  for (const annotation of data.annotations || [])
    latest.set(`${annotation.module}\0${annotation.kind}\0${annotation.portName}`, annotation);
  return [...latest.values()];
}

function moduleHierarchyPaths(data) {
  const modules = new Set();
  const targets = new Set();
  const children = new Map();
  for (const edge of data.hierarchy || []) {
    modules.add(edge.parentModule);
    modules.add(edge.targetModule);
    targets.add(edge.targetModule);
    if (!children.has(edge.parentModule)) children.set(edge.parentModule, []);
    children.get(edge.parentModule).push(edge);
  }
  for (const annotation of data.annotations || []) modules.add(annotation.module);
  for (const alias of data.aliases || []) modules.add(alias.module);

  let roots = [...modules].filter(module => !targets.has(module));
  if (!roots.length && data.focusModule) roots = [data.focusModule];
  roots.sort((a, b) => a.localeCompare(b));

  const paths = new Map();
  const addPath = (module, path) => {
    if (!paths.has(module)) paths.set(module, []);
    paths.get(module).push(path);
  };
  const visit = (module, path, stack) => {
    addPath(module, path);
    if (stack.has(module)) return;
    const nextStack = new Set(stack);
    nextStack.add(module);
    const edges = (children.get(module) || [])
      .slice()
      .sort((a, b) => a.instanceName.localeCompare(b.instanceName) ||
                      a.targetModule.localeCompare(b.targetModule));
    for (const edge of edges)
      visit(edge.targetModule, `${path}/${edge.instanceName}:${edge.targetModule}`, nextStack);
  };

  for (const root of roots) visit(root, `$root:${root}`, new Set());
  for (const module of modules)
    if (!paths.has(module)) addPath(module, `$unreachable:${module}`);
  return paths;
}

function computeDomainGroups(data) {
  const modulePaths = moduleHierarchyPaths(data);
  const aliases = data.aliases || [];
  const aliasEntries = new Map();
  for (const alias of aliases) {
    const key = `${alias.module}\0${alias.alias}`;
    if (!aliasEntries.has(key)) aliasEntries.set(key, []);
    aliasEntries.get(key).push(alias);
  }

  const parent = new Map();
  const find = value => {
    if (!parent.has(value)) parent.set(value, value);
    const p = parent.get(value);
    if (p === value) return value;
    const root = find(p);
    parent.set(value, root);
    return root;
  };
  const unite = (a, b) => {
    if (!a || !b) return;
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(rb, ra);
  };

  const valueInfo = new Map();
  const objectsByValue = new Map();
  const addDomainValue = (domainKind, valuePath, object) => {
    if (!valuePath) return;
    domainKind = domainKind || 'unknown domain';
    find(valuePath);
    if (!valueInfo.has(valuePath))
      valueInfo.set(valuePath, {domainKind, members: new Set()});
    const info = valueInfo.get(valuePath);
    info.members.add(valuePath);
    if (info.domainKind === 'unknown domain' && domainKind !== 'unknown domain')
      info.domainKind = domainKind;
    if (!object) return;
    if (!objectsByValue.has(valuePath)) objectsByValue.set(valuePath, []);
    objectsByValue.get(valuePath).push(object);
  };

  const valuePathsForAlias = (module, modulePath, aliasName) => {
    const entries = aliasEntries.get(`${module}\0${aliasName}`) || [];
    if (!entries.length)
      return [{domainKind: 'unknown domain', valuePath: `${modulePath}.${aliasName || '?'}`}];
    return entries.map(alias => ({
      domainKind: alias.domainKind || 'unknown domain',
      valuePath: `${modulePath}.${alias.portName || alias.alias}`,
      alias
    }));
  };

  for (const alias of aliases) {
    for (const modulePath of modulePaths.get(alias.module) || []) {
      const values = valuePathsForAlias(alias.module, modulePath, alias.alias);
      for (const value of values) {
        addDomainValue(value.domainKind, value.valuePath, {
          path: value.valuePath,
          kind: alias.inferred ? 'inferred domain value' : 'domain value',
          direction: alias.direction,
          type: alias.domainKind
        });
      }
      for (let i = 1; i < values.length; ++i)
        unite(values[0].valuePath, values[i].valuePath);
    }
  }

  for (const edge of data.hierarchy || []) {
    for (const parentPath of modulePaths.get(edge.parentModule) || []) {
      const childPath = `${parentPath}/${edge.instanceName}:${edge.targetModule}`;
      const childAliases = aliases.filter(alias =>
        alias.module === edge.targetModule &&
        alias.direction !== 'local' &&
        alias.direction !== 'inferred');
      for (const alias of childAliases) {
        const parentValues =
          valuePathsForAlias(edge.parentModule, parentPath,
                             `${edge.instanceName}.${alias.portName}`);
        const childValues = valuePathsForAlias(edge.targetModule, childPath, alias.alias);
        for (const parentValue of parentValues)
          for (const childValue of childValues)
            unite(parentValue.valuePath, childValue.valuePath);
      }
    }
  }

  const objectKinds = new Set(['hardware', 'register', 'wire', 'instance-port']);
  for (const annotation of annotationsForDisplay(data)) {
    if (!objectKinds.has(annotation.kind)) continue;
    for (const modulePath of modulePaths.get(annotation.module) || []) {
      const object = {
        path: `${modulePath}.${annotation.portName}`,
        kind: annotation.kind,
        direction: annotation.direction,
        type: annotation.type
      };
      for (const aliasName of annotation.aliases || []) {
        if (!aliasName || aliasName === '?') continue;
        for (const resolved of valuePathsForAlias(annotation.module, modulePath, aliasName))
          addDomainValue(resolved.domainKind, resolved.valuePath, object);
      }
    }
  }

  for (const [valuePath, info] of valueInfo) {
    const root = find(valuePath);
    if (!valueInfo.has(root))
      valueInfo.set(root, {domainKind: info.domainKind, members: new Set()});
    const rootInfo = valueInfo.get(root);
    if (rootInfo.domainKind === 'unknown domain' && info.domainKind !== 'unknown domain')
      rootInfo.domainKind = info.domainKind;
    for (const member of info.members) rootInfo.members.add(member);
    const rootObjects = objectsByValue.get(root) || [];
    rootObjects.push(...(objectsByValue.get(valuePath) || []));
    objectsByValue.set(root, rootObjects);
  }

  const groups = new Map();
  for (const [valuePath, info] of valueInfo) {
    if (find(valuePath) !== valuePath) continue;
    const domainKind = info.domainKind || 'unknown domain';
    if (!groups.has(domainKind)) groups.set(domainKind, []);
    groups.get(domainKind).push({
      valuePath,
      associatedValues: [...info.members].sort((a, b) => a.localeCompare(b)),
      objects: uniqueBy(objectsByValue.get(valuePath) || [], item => `${item.path}\0${item.kind}`)
        .sort((a, b) => a.path.localeCompare(b.path) || a.kind.localeCompare(b.kind))
    });
  }
  return [...groups.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([domainKind, values]) => ({
      domainKind,
      values: values.sort((a, b) => a.valuePath.localeCompare(b.valuePath))
    }));
}

function renderSuggestions(data) {
  const suggestions = data.suggestions || [];
  if (!suggestions.length) return '<p class="muted">No actionable suggestions recorded.</p>';
  return suggestions.map(s => `<div class="domainValue">
    <h3>${esc(s.kind || 'suggestion')}</h3>
    <p>${esc(s.description || '')}</p>
    <p>${s.source ? `<span class="pill">Source: ${esc(s.source)}</span>` : ''}${s.destination ? `<span class="pill">Destination: ${esc(s.destination)}</span>` : ''}</p>
    ${s.location ? `<pre>${esc(s.location)}</pre>` : ''}
  </div>`).join('');
}

function renderLifetimeAnnotations(data) {
  const aliases = data.aliases || [];
  const annotations = annotationsForDisplay(data);
  if (!aliases.length && !annotations.length)
    return '<p class="muted">No lifetime annotations recorded.</p>';

  const aliasesByModule = new Map();
  for (const alias of aliases) {
    if (!aliasesByModule.has(alias.module)) aliasesByModule.set(alias.module, []);
    aliasesByModule.get(alias.module).push(alias);
  }

  const annotationsByModule = new Map();
  for (const annotation of annotations) {
    if (!annotationsByModule.has(annotation.module))
      annotationsByModule.set(annotation.module, []);
    annotationsByModule.get(annotation.module).push(annotation);
  }

  const modules = [...new Set([...aliasesByModule.keys(), ...annotationsByModule.keys()])]
    .sort((a, b) => (a === data.focusModule ? -1 : b === data.focusModule ? 1 : a.localeCompare(b)));

  const kindTitle = new Map([
    ['domain', 'Domain Values'],
    ['hardware', 'Module Ports'],
    ['instance-port', 'Instance Ports'],
    ['register', 'Registers'],
    ['wire', 'Wires']
  ]);

  const renderAnnotation = annotation => {
    const aliases = annotation.aliases && annotation.aliases.length ? annotation.aliases : ['?'];
    const lifetimeParams = annotation.kind !== 'domain'
      ? `&lt;${aliases.map(alias => `<span class="lifetimeAlias">${esc(alias)}</span>`).join(', ')}&gt;`
      : '';
    return `<div class="lifetimeRow">
      <span class="muted">${esc(annotation.direction)}</span>
      <div><strong>${esc(annotation.portName)}</strong>${lifetimeParams} <span class="muted">${esc(annotation.type)}</span></div>
    </div>`;
  };

  return modules.map(module => {
    const moduleAliases = (aliasesByModule.get(module) || [])
      .sort((a, b) => a.alias.localeCompare(b.alias));
    const legend = moduleAliases.length
      ? moduleAliases.map(alias =>
        `<span class="pill"><span class="lifetimeAlias">${esc(alias.alias)}</span> = ${esc(alias.direction)} ${esc(alias.portName)} : ${esc(alias.domainKind)}${alias.inferred ? ' <span class="lifetimeInferred">inferred</span>' : ''}</span>`
      ).join('')
      : '<span class="pill">no domain values</span>';

    const rowsByKind = new Map();
    for (const annotation of annotationsByModule.get(module) || []) {
      if (!rowsByKind.has(annotation.kind)) rowsByKind.set(annotation.kind, []);
      rowsByKind.get(annotation.kind).push(annotation);
    }

    const rows = [...rowsByKind.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([kind, rows]) => `<h4>${esc(kindTitle.get(kind) || kind)}</h4>${rows
        .sort((a, b) => a.portName.localeCompare(b.portName))
        .map(renderAnnotation)
        .join('')}`)
      .join('');

    return `<div class="lifetimeModule">
      <h3>${esc(module)}</h3>
      <div>${legend}</div>
      ${rows}
    </div>`;
  }).join('');
}

function matchesDomainFilter(group, value, query) {
  if (!query) return true;
  const haystack = [
    group.domainKind,
    value.valuePath,
    ...value.associatedValues,
    ...value.objects.flatMap(object => [object.path, object.kind, object.direction, object.type])
  ].join('\n').toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function renderDomainGroups(groups, query = '') {
  if (!groups.length) return '<p class="muted">No domain values recorded.</p>';
  let renderedCount = 0;
  const renderedGroups = groups.map(group => {
    const filteredValues = group.values.filter(value => matchesDomainFilter(group, value, query));
    if (!filteredValues.length) return '';
    renderedCount += filteredValues.length;
    const values = filteredValues.map(value => {
      const associated = value.associatedValues
        .map(path => `<li><span class="domainPath">${esc(path)}</span></li>`)
        .join('');
      const objects = value.objects.length
        ? value.objects.map(object => `<li><strong>${esc(object.path)}</strong> <span class="muted">${esc(object.kind)}${object.direction ? `, ${esc(object.direction)}` : ''}${object.type ? `, ${esc(object.type)}` : ''}</span></li>`).join('')
        : '<li class="muted">No associated ports, registers, or wires recorded.</li>';
      return `<div class="domainValue">
        <div class="valueHeader">
          <div class="domainPath">${esc(value.valuePath)}</div>
          <div>
            <span class="pill">${value.associatedValues.length} domain value${value.associatedValues.length === 1 ? '' : 's'}</span>
            <span class="pill">${value.objects.length} object${value.objects.length === 1 ? '' : 's'}</span>
          </div>
        </div>
        <div class="splitList">
          <div>
            <h4>Equivalent Domain Values</h4>
            <ul>${associated}</ul>
          </div>
          <div>
            <h4>Objects Using This Domain</h4>
            <ul>${objects}</ul>
          </div>
        </div>
      </div>`;
    }).join('');
    return `<div class="domainGroup">
      <h3>${esc(group.domainKind)} <span class="pill">${filteredValues.length} of ${group.values.length} value${group.values.length === 1 ? '' : 's'}</span></h3>
      ${values}
    </div>`;
  }).join('');
  return renderedCount ? renderedGroups : '<p class="muted">No domain values match the filter.</p>';
}

function hierarchyRoots(data) {
  const modules = new Set();
  const targets = new Set();
  const children = new Map();
  for (const edge of data.hierarchy || []) {
    modules.add(edge.parentModule);
    modules.add(edge.targetModule);
    targets.add(edge.targetModule);
    if (!children.has(edge.parentModule)) children.set(edge.parentModule, []);
    children.get(edge.parentModule).push(edge);
  }
  for (const annotation of data.annotations || []) modules.add(annotation.module);
  for (const alias of data.aliases || []) modules.add(alias.module);

  let roots = [...modules].filter(module => !targets.has(module));
  if (!roots.length && data.focusModule) roots = [data.focusModule];
  roots.sort((a, b) => a.localeCompare(b));
  return {roots, children};
}

function makeClusterNode(module, path, label, depth) {
  return {
    module,
    path,
    label,
    depth,
    children: [],
    clusters: new Map()
  };
}

function buildHierarchyForest(data) {
  const {roots, children} = hierarchyRoots(data);
  const pathToNode = new Map();

  const visit = (module, path, label, depth, stack) => {
    const node = makeClusterNode(module, path, label, depth);
    pathToNode.set(path, node);
    if (stack.has(module))
      return node;

    const nextStack = new Set(stack);
    nextStack.add(module);
    const edges = (children.get(module) || [])
      .slice()
      .sort((a, b) => a.instanceName.localeCompare(b.instanceName) ||
                      a.targetModule.localeCompare(b.targetModule));
    for (const edge of edges) {
      const childPath = `${path}/${edge.instanceName}:${edge.targetModule}`;
      node.children.push(visit(edge.targetModule, childPath,
                               `${edge.instanceName} : ${edge.targetModule}`,
                               depth + 1, nextStack));
    }
    return node;
  };

  const forest = roots.map(root => visit(root, `$root:${root}`, root, 0, new Set()));
  return {forest, pathToNode};
}

function ownerNodeForPath(path, pathToNode) {
  let best = null;
  for (const [nodePath, node] of pathToNode) {
    if (path === nodePath || path.startsWith(`${nodePath}.`) ||
        path.startsWith(`${nodePath}/`)) {
      if (!best || nodePath.length > best.path.length)
        best = node;
    }
  }
  return best;
}

function localPath(path, nodePath) {
  if (path.startsWith(`${nodePath}.`))
    return path.slice(nodePath.length + 1);
  if (path.startsWith(`${nodePath}/`))
    return path.slice(nodePath.length + 1);
  return path;
}

function getCluster(node, group, value) {
  if (!node.clusters.has(group.domainKind))
    node.clusters.set(group.domainKind, new Map());
  const values = node.clusters.get(group.domainKind);
  if (!values.has(value.valuePath)) {
    values.set(value.valuePath, {
      domainKind: group.domainKind,
      valuePath: value.valuePath,
      handles: new Set(),
      objects: []
    });
  }
  return values.get(value.valuePath);
}

function computeHierarchyClusters(data, groups, query) {
  const {forest, pathToNode} = buildHierarchyForest(data);
  let clusterCount = 0;
  let objectCount = 0;

  for (const group of groups) {
    for (const value of group.values) {
      if (!matchesDomainFilter(group, value, query))
        continue;

      const touchedNodes = new Set();
      for (const handle of value.associatedValues) {
        const node = ownerNodeForPath(handle, pathToNode);
        if (!node)
          continue;
        getCluster(node, group, value).handles.add(localPath(handle, node.path));
        touchedNodes.add(node);
      }

      for (const object of value.objects) {
        const node = ownerNodeForPath(object.path, pathToNode);
        if (!node)
          continue;
        const cluster = getCluster(node, group, value);
        cluster.objects.push({
          path: localPath(object.path, node.path),
          kind: object.kind,
          direction: object.direction,
          type: object.type
        });
        touchedNodes.add(node);
        ++objectCount;
      }

      clusterCount += touchedNodes.size;
    }
  }

  return {forest, clusterCount, objectCount};
}

function renderHierarchyCluster(kind, valueMap) {
  const values = [...valueMap.values()]
    .sort((a, b) => a.valuePath.localeCompare(b.valuePath));
  return values.map(value => {
    const handles = [...value.handles].sort((a, b) => a.localeCompare(b));
    const objects = uniqueBy(value.objects, item => `${item.path}\0${item.kind}`)
      .sort((a, b) => a.path.localeCompare(b.path) || a.kind.localeCompare(b.kind));
    const handleList = handles.length
      ? handles.map(handle => `<li><span class="domainPath">${esc(handle)}</span></li>`).join('')
      : '<li class="muted">No local domain handles recorded.</li>';
    const objectList = objects.length
      ? objects.map(object => `<li><strong>${esc(object.path)}</strong> <span class="muted">${esc(object.kind)}${object.direction ? `, ${esc(object.direction)}` : ''}${object.type ? `, ${esc(object.type)}` : ''}</span></li>`).join('')
      : '<li class="muted">No local objects recorded.</li>';
    return `<div class="domainCluster">
      <div class="clusterHeader">
        <div><strong>${esc(kind)}</strong> <span class="domainPath">${esc(value.valuePath)}</span></div>
        <div>
          <span class="pill">${handles.length} handle${handles.length === 1 ? '' : 's'}</span>
          <span class="pill">${objects.length} object${objects.length === 1 ? '' : 's'}</span>
        </div>
      </div>
      <div class="clusterItems">
        <div>
          <h4>Domain Handles</h4>
          <ul class="objectList">${handleList}</ul>
        </div>
        <div>
          <h4>Objects</h4>
          <ul class="objectList">${objectList}</ul>
        </div>
      </div>
    </div>`;
  }).join('');
}

function nodeHasVisibleContent(node) {
  if (node.clusters.size)
    return true;
  return node.children.some(nodeHasVisibleContent);
}

function renderHierarchyNode(node, query) {
  if (query && !nodeHasVisibleContent(node))
    return '';
  const clusterEntries = [...node.clusters.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]));
  const clusterCount = clusterEntries.reduce((sum, [, values]) => sum + values.size, 0);
  const objectCount = clusterEntries.reduce((sum, [, values]) =>
    sum + [...values.values()].reduce((valueSum, value) => valueSum + value.objects.length, 0), 0);
  const clusters = clusterEntries.length
    ? `<div class="clusterSet">${clusterEntries.map(([kind, values]) =>
        renderHierarchyCluster(kind, values)).join('')}</div>`
    : query ? '' : '<p class="muted">No local domain values recorded.</p>';
  const children = node.children.map(child => renderHierarchyNode(child, query)).join('');
  const open = node.depth < 2 || query ? ' open' : '';
  return `<details class="instanceNode"${open}>
    <summary>
      <span class="instanceHeader">
        <span class="instanceTitle">${esc(node.label)}</span>
        <span class="muted">${esc(node.path)}</span>
        <span class="pill">${clusterCount} domain value${clusterCount === 1 ? '' : 's'}</span>
        <span class="pill">${objectCount} object${objectCount === 1 ? '' : 's'}</span>
      </span>
    </summary>
    ${clusters}
    ${children}
  </details>`;
}

function renderDomainHierarchy(data, groups, query = '') {
  const {forest, clusterCount, objectCount} = computeHierarchyClusters(data, groups, query);
  if (!forest.length)
    return '<p class="muted">No hierarchy recorded.</p>';
  if (query && !clusterCount)
    return '<p class="muted">No hierarchy clusters match the filter.</p>';
  return `<div class="hierarchyTree">
    <p class="muted">${esc(clusterCount)} domain value cluster${clusterCount === 1 ? '' : 's'}, ${esc(objectCount)} object${objectCount === 1 ? '' : 's'}</p>
    ${forest.map(root => renderHierarchyNode(root, query)).join('')}
  </div>`;
}

function renderConflictTrace(data) {
  const operation = (data.nodes || []).find(node => node.kind === 'operation');
  const conflicts = (data.edges || []).filter(edge => edge.conflict);
  return `<div class="grid">
    <div>
      <h3>Operation at Error</h3>
      ${operation ? `<pre>${esc(operation.detail || operation.label)}</pre>` : '<p class="muted">No operation recorded.</p>'}
    </div>
    <div>
      <h3>Conflicting Constraints</h3>
      ${conflicts.length ? conflicts.map(edge => `<pre>${esc(edge.reason || edge.kind)}\n${esc(edge.from)}\n${esc(edge.to)}</pre>`).join('') : '<p class="muted">No conflict edges recorded.</p>'}
    </div>
  </div>`;
}

function countObjects(groups) {
  return groups.reduce((sum, group) =>
    sum + group.values.reduce((valueSum, value) => valueSum + value.objects.length, 0), 0);
}

function renderTabs() {
  const tabs = [
    ['overview', 'Overview'],
    ['domains', 'Domain Map'],
    ['lifetimes', 'Lifetime Annotations'],
    ['raw', 'Raw JSON']
  ];
  return `<div class="tabBar">${tabs.map(([id, label]) =>
    `<button class="tabButton${activeTab === id ? ' active' : ''}" data-tab="${id}">${esc(label)}</button>`
  ).join('')}</div>`;
}

function renderOverview(data, groups) {
  return `
    <div class="block">
      <h2>Error Summary</h2>
      <p class="error">${esc(data.failureSummary || data.failureKind || '')}</p>
      <div class="metricGrid">
        <div class="metric"><strong>${esc(groups.length)}</strong><span class="muted">Domain kinds</span></div>
        <div class="metric"><strong>${esc(groups.reduce((sum, group) => sum + group.values.length, 0))}</strong><span class="muted">Domain values</span></div>
        <div class="metric"><strong>${esc(countObjects(groups))}</strong><span class="muted">Associated objects</span></div>
        <div class="metric"><strong>${esc((data.suggestions || []).length)}</strong><span class="muted">Suggestions</span></div>
      </div>
      ${renderConflictTrace(data)}
    </div>
    <div class="block">
      <h2>Suggested Fixes</h2>
      ${renderSuggestions(data)}
    </div>`;
}

function renderDomainsTab(groups) {
  return `<div class="block">
    <h2>Domain Map</h2>
    <p class="sectionLead">Domain values are grouped by domain kind. Each entry shows the hierarchical values that were unified and the ports, registers, or wires that use the domain.</p>
    <div class="viewBar">
      <span class="muted">View</span>
      <button class="viewButton${domainMapMode === 'hierarchy' ? ' active' : ''}" data-domain-view="hierarchy">Hierarchy Clusters</button>
      <button class="viewButton${domainMapMode === 'list' ? ' active' : ''}" data-domain-view="list">Value List</button>
    </div>
    <div class="searchRow">
      <input id="domainFilter" type="search" value="${esc(domainFilter)}" placeholder="Filter domain values or objects">
      <span class="muted">${esc(groups.reduce((sum, group) => sum + group.values.length, 0))} values</span>
    </div>
    ${domainMapMode === 'hierarchy'
      ? renderDomainHierarchy(currentData, groups, domainFilter)
      : renderDomainGroups(groups, domainFilter)}
  </div>`;
}

function renderLifetimesTab(data) {
  return `<div class="block">
    <h2>Lifetime Annotations</h2>
    <p class="sectionLead">Read <span class="lifetimeAlias">value&lt;'d1, 'd2&gt;</span> as inferred domain parameters ordered by domain kind.</p>
    ${renderLifetimeAnnotations(data)}
  </div>`;
}

function renderRawTab(data) {
  return `<div class="block">
    <h2>Raw JSON</h2>
    <pre class="rawJson">${esc(JSON.stringify(data, null, 2))}</pre>
  </div>`;
}

function renderActiveTab() {
  if (!currentData) return;
  const body = activeTab === 'overview' ? renderOverview(currentData, currentGroups)
    : activeTab === 'domains' ? renderDomainsTab(currentGroups)
    : activeTab === 'lifetimes' ? renderLifetimesTab(currentData)
    : renderRawTab(currentData);
  content.innerHTML = `${renderTabs()}${body}`;
  document.querySelectorAll('[data-tab]').forEach(button => {
    button.addEventListener('click', () => {
      activeTab = button.dataset.tab;
      renderActiveTab();
    });
  });
  document.querySelectorAll('[data-domain-view]').forEach(button => {
    button.addEventListener('click', () => {
      domainMapMode = button.dataset.domainView;
      renderActiveTab();
    });
  });
  const filter = document.getElementById('domainFilter');
  if (filter)
    filter.addEventListener('input', event => {
      domainFilter = event.target.value;
      renderActiveTab();
      const nextFilter = document.getElementById('domainFilter');
      if (nextFilter)
        nextFilter.focus();
    });
}

function render(data, filename) {
  currentData = data;
  currentGroups = computeDomainGroups(data);
  activeTab = 'overview';
  domainFilter = '';
  domainMapMode = 'hierarchy';
  const groups = currentGroups;
  const totalValues = groups.reduce((sum, group) => sum + group.values.length, 0);
  summary.innerHTML = `
    <h2>${esc(data.module || filename)}</h2>
    <p class="error">${esc(data.failureKind || 'no failure kind')}</p>
    <p>${esc(data.failureSummary || '')}</p>
    <p><span class="pill">focus: ${esc(data.focusModule || data.module || '')}</span></p>
    <p><span class="pill">${groups.length} domain kind${groups.length === 1 ? '' : 's'}</span><span class="pill">${totalValues} value${totalValues === 1 ? '' : 's'}</span></p>
    <h3>Instance Paths</h3>
    ${(data.instancePaths || []).length ? (data.instancePaths || []).map(path => `<pre>${esc(path)}</pre>`).join('') : '<p class="muted">None recorded.</p>'}
  `;
  renderActiveTab();
}

input.addEventListener('change', async event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    render(data, file.name);
  } catch (error) {
    summary.innerHTML = '<h2>Load Failed</h2>';
    content.innerHTML = `<div class="empty error">${esc(error.message)}</div>`;
  }
});
</script>
</body>
</html>
